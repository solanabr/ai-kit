name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Tags, not just the tip: tests/test_update.sh reads the v2.1.0 settings.json and
          # the frozen update.sh byte range straight from the tag, so the migration baseline
          # is matched by construction instead of by a vendored copy that drifts.
          fetch-depth: 0

      - name: Validate JSON files
        run: |
          python3 -c "import json; json.load(open('.claude/settings.json'))"
          python3 -c "import json; json.load(open('.mcp.json'))"

      - name: Run validation
        run: bash validate.sh

      - name: Run test suite
        run: bash tests/run_all.sh

  smoke-test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Smoke test — fresh install
        run: |
          TEMP_DIR=$(mktemp -d)
          (cd "$TEMP_DIR" && git init -q)
          SOLANA_AI_KIT_LOCAL_SRC="$GITHUB_WORKSPACE" bash install.sh "$TEMP_DIR"
          test -d "$TEMP_DIR/.claude/agents"
          test -f "$TEMP_DIR/.claude/settings.json"
          python3 -c "import json; json.load(open('$TEMP_DIR/.claude/settings.json'))"
          echo "✓ Fresh install smoke test passed"

      - name: Smoke test — agents mode
        run: |
          TEMP_DIR=$(mktemp -d)
          (cd "$TEMP_DIR" && git init -q)
          SOLANA_AI_KIT_LOCAL_SRC="$GITHUB_WORKSPACE" bash install.sh --agents "$TEMP_DIR"
          test -d "$TEMP_DIR/.agents/agents"
          test ! -d "$TEMP_DIR/.claude"
          echo "✓ Agents mode smoke test passed"

  # The real clients discover the --agents install (no API key, no model calls).
  agents-mode-clients:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      SOLANA_AI_KIT_LOCAL_SRC: ${{ github.workspace }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned opencode and Codex CLIs
        run: npm install -g opencode-ai@1.18.32 @openai/codex@0.156.1 --no-audit --no-fund

      - name: Agents-mode install
        run: |
          T="$RUNNER_TEMP/proj"; mkdir -p "$T"; git -C "$T" init -q
          bash install.sh --agents "$T" > /dev/null

      - name: opencode discovers the kit skills in .agents/skills
        run: |
          cd "$RUNNER_TEMP/proj"
          timeout 300 opencode debug skill > "$RUNNER_TEMP/opencode-skills.json"
          # skill-packs is in the list because pack routing rests on a skill description
          # being listed outside Claude Code too; if it is not discovered here, the kit
          # cannot surface a pack in an --agents install at all.
          for s in idea-sprint pitch-deck hackathon skill-packs; do
            grep -q "/\.agents/skills/$s/SKILL\.md" "$RUNNER_TEMP/opencode-skills.json" \
              || { echo "::error::opencode did not discover $s"; head -c 3000 "$RUNNER_TEMP/opencode-skills.json"; exit 1; }
          done

      - name: Codex loads AGENTS.md and the kit skills
        run: |
          cd "$RUNNER_TEMP/proj"
          timeout 300 codex debug prompt-input "hello" > "$RUNNER_TEMP/codex-prompt.json"
          grep -q 'solana-builder' "$RUNNER_TEMP/codex-prompt.json" \
            || { echo "::error::Codex did not load AGENTS.md"; head -c 3000 "$RUNNER_TEMP/codex-prompt.json"; exit 1; }
          grep -q 'idea-sprint' "$RUNNER_TEMP/codex-prompt.json" \
            || { echo "::error::Codex did not list the kit skills"; head -c 3000 "$RUNNER_TEMP/codex-prompt.json"; exit 1; }
