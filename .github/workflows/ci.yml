name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # One level, not recursive. install.sh fetches the packs with
          # `submodule update --init --depth 1` and deliberately never recurses, because a
          # pack's own submodules are pinned by that pack's author and are not reviewed
          # here. Checking them out gives CI a tree no install can produce, and with
          # SOLANA_AI_KIT_LOCAL_SRC the smoke test below would copy those nested
          # third-party trees straight into its fixture project. The registry's `vendored`
          # pins are read from each pack's index, which one level provides.
          submodules: true
          # Tags, not just the tip: tests/test_update.sh reads the v2.1.0 settings.json and
          # the frozen update.sh byte range straight from the tag, so the migration baseline
          # is matched by construction instead of by a vendored copy that drifts.
          fetch-depth: 0

      - name: Validate JSON files
        run: |
          python3 -c "import json; json.load(open('.claude/settings.json'))"
          python3 -c "import json; json.load(open('.mcp.json'))"

      - name: Run validation
        run: bash validate.sh

      - name: Run test suite
        run: bash tests/run_all.sh

  # Templates are copied into user projects, so GitHub never resolves their actions;
  # check every uses: under .github/ against the API so a deleted action fails here.
  actions-resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Every uses: under .github/ resolves"
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/list-actions.sh --resolve

  smoke-test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Smoke test — fresh install
        run: |
          TEMP_DIR=$(mktemp -d)
          (cd "$TEMP_DIR" && git init -q)
          SOLANA_AI_KIT_LOCAL_SRC="$GITHUB_WORKSPACE" bash install.sh "$TEMP_DIR"
          test -d "$TEMP_DIR/.claude/agents"
          test -f "$TEMP_DIR/.claude/settings.json"
          python3 -c "import json; json.load(open('$TEMP_DIR/.claude/settings.json'))"
          echo "✓ Fresh install smoke test passed"

      - name: Smoke test — agents mode
        run: |
          TEMP_DIR=$(mktemp -d)
          (cd "$TEMP_DIR" && git init -q)
          SOLANA_AI_KIT_LOCAL_SRC="$GITHUB_WORKSPACE" bash install.sh --agents "$TEMP_DIR"
          test -d "$TEMP_DIR/.agents/agents"
          test ! -d "$TEMP_DIR/.claude"
          echo "✓ Agents mode smoke test passed"

  # The real clients discover the --agents install (no API key, no model calls).
  agents-mode-clients:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      SOLANA_AI_KIT_LOCAL_SRC: ${{ github.workspace }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install pinned opencode and Codex CLIs
        run: npm install -g opencode-ai@1.18.32 @openai/codex@0.156.1 --no-audit --no-fund

      - name: Agents-mode installs (default, near the Codex budget, over it)
        run: |
          # big: 42 project skills, the most measured with every description whole
          # (#212). over: sendai alone registers 57 and Codex cuts 11 of them.
          for p in proj:'' big:helius,solana-mobile,light-protocol,jupiter over:sendai; do
            T="$RUNNER_TEMP/${p%%:*}"; packs="${p#*:}"
            mkdir -p "$T"; git -C "$T" init -q
            bash install.sh --agents ${packs:+--with "$packs"} "$T" > /dev/null
          done

      - name: opencode discovers the kit skills in .agents/skills
        run: |
          cd "$RUNNER_TEMP/proj"
          timeout 300 opencode debug skill > "$RUNNER_TEMP/opencode-skills.json"
          # Both skills the kit ships in-repo. skill-packs carries the pack routing,
          # so an --agents install can surface a pack at all.
          for s in skill-packs token-extensions; do
            grep -q "/\.agents/skills/$s/SKILL\.md" "$RUNNER_TEMP/opencode-skills.json" \
              || { echo "::error::opencode did not discover $s"; head -c 3000 "$RUNNER_TEMP/opencode-skills.json"; exit 1; }
          done
          # An installed pack's skill, which reaches the project by a different route
          # than the two above: a submodule checkout under skills/ext/ rather than
          # install.sh's copy of the in-repo skills. auditor-skill is the pack to assert
          # on — a core pack that is a submodule, so a failed fetch aborts the install
          # and this cannot flake on an absent pack (anthropic-skills only warns), and
          # the one core pack whose SKILL.md sits at its root, so the path does not
          # encode the pack's inner layout.
          grep -q '/\.agents/skills/ext/auditor-skill/SKILL\.md' "$RUNNER_TEMP/opencode-skills.json" \
            || { echo "::error::opencode did not discover the auditor-skill pack"; head -c 3000 "$RUNNER_TEMP/opencode-skills.json"; exit 1; }

      - name: Codex loads AGENTS.md and the kit skills
        run: |
          cd "$RUNNER_TEMP/proj"
          timeout 300 codex debug prompt-input "hello" > "$RUNNER_TEMP/codex-prompt.json"
          grep -q 'solana-builder' "$RUNNER_TEMP/codex-prompt.json" \
            || { echo "::error::Codex did not load AGENTS.md"; head -c 3000 "$RUNNER_TEMP/codex-prompt.json"; exit 1; }
          grep -q 'skill-packs' "$RUNNER_TEMP/codex-prompt.json" \
            || { echo "::error::Codex did not list the kit skills"; head -c 3000 "$RUNNER_TEMP/codex-prompt.json"; exit 1; }
          # The same installed-pack check as the opencode step, by name rather than
          # path: Codex splits one shared description budget across every registered
          # skill and truncates each entry, so the name is the stable part. No false
          # positive — CLAUDE-solana.md, which becomes AGENTS.md here, never names it.
          grep -q 'auditor-skill' "$RUNNER_TEMP/codex-prompt.json" \
            || { echo "::error::Codex did not list the auditor-skill pack"; head -c 3000 "$RUNNER_TEMP/codex-prompt.json"; exit 1; }

      # A name survives when Codex empties or cuts its description, so the steps above
      # cannot see the shared budget running out (#212). Compare each description with
      # its SKILL.md instead; the over-budget install proves the check still sees a cut.
      - name: Codex keeps every project skill description whole
        run: |
          check() {
            ( cd "$RUNNER_TEMP/$1" && timeout 300 codex debug prompt-input "hello" > "$RUNNER_TEMP/codex-$1.json" ) || return 3
            python3 .github/scripts/codex-skill-budget.py "$RUNNER_TEMP/codex-$1.json" "$RUNNER_TEMP/$1/.agents/skills" "$2"
          }
          check proj 8 || { echo "::error::Codex shortened a description in the default --agents install"; exit 1; }
          check big 40 || { echo "::error::Codex shortened a description with four Solana packs; the kit is past the skill budget"; exit 1; }
          rc=0; check over 50 || rc=$?
          [ "$rc" -eq 1 ] || { echo "::error::the budget check did not flag sendai's 57 skills (exit $rc); has Codex's output format changed?"; exit 1; }
