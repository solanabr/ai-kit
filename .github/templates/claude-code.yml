name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Both conditions are required. Without the second, any GitHub account can start
    # this job by commenting "@claude" — and it runs with contents/pull-requests/issues
    # write and your ANTHROPIC_API_KEY. Keep the association check if you keep those
    # scopes; narrow `contents` to `read` if Claude never needs to push.
    if: |
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Solana
        uses: solana-labs/setup-solana@v1
        with:
          solana-version: '2.1.0'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Anchor
        run: cargo install --git https://github.com/coral-xyz/anchor anchor-cli --tag v1.0.2 --locked

      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
