[package]
name = "pburn"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
no-log-ix-name = []

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
# anchor-spl 1.2.0 pins spl-token-2022-interface ^2 (no PermissionedBurn). Rename the 3.x copy.
t22v3 = { package = "spl-token-2022-interface", version = "3.1" }
spl-transfer-hook-interface = "2.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
